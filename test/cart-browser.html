<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><iframe style="width:390px;height:850px"></iframe><script>
(async()=>{const old=localStorage.getItem('urbor-catalog-basket');localStorage.setItem('urbor-catalog-basket',JSON.stringify({'6302':2,'5609':1}));const f=document.querySelector('iframe');f.src='../cart.html';const wait=()=>new Promise(r=>setTimeout(r,100));const check=(v,m)=>{if(!v)throw Error(m);};try{for(let n=0;n<200;n++){if(f.contentDocument?.querySelectorAll('.cart-item').length===2)break;await wait();}const d=f.contentDocument,w=f.contentWindow;check(d.querySelectorAll('.cart-item').length===2,'saved items');const data=await(await fetch('../content-assets/catalog/products.json')).json();const p=data.products.find(p=>p.id==='6302'),egg=data.products.find(p=>p.id==='5609');check(d.getElementById('cart-total').textContent===`৳ ${(p.price*2+egg.price).toLocaleString('en-BD')}`,'subtotal');d.querySelector('[data-id="6302"] [data-action="plus"]').click();check(JSON.parse(localStorage.getItem('urbor-catalog-basket'))['6302']===3,'quantity persistence');d.querySelector('[data-id="6302"] [data-action="remove"]').click();check(d.querySelectorAll('.cart-item').length===1,'remove');d.documentElement.lang='bn';await wait();check(d.getElementById('cart-count').textContent.includes('পণ্য'),'Bengali');check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'mobile width');d.querySelector('[data-action="remove"]').click();check(!d.getElementById('cart-empty').hidden&&d.getElementById('cart-layout').hidden,'empty basket');document.getElementById('result').textContent='PASS: saved basket, subtotal, quantity persistence, removal, Bengali, mobile layout, empty state';}catch(e){document.getElementById('result').textContent='FAIL: '+e.message;}finally{if(old===null)localStorage.removeItem('urbor-catalog-basket');else localStorage.setItem('urbor-catalog-basket',old);}})();</script>
