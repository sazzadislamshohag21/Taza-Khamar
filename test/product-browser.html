<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><iframe src="../product.html?id=6302" style="width:390px;height:850px"></iframe><script>
(async()=>{const f=document.querySelector('iframe');const wait=()=>new Promise(r=>setTimeout(r,100));const check=(x,m)=>{if(!x)throw Error(m);};try{for(let n=0;n<200;n++){if(f.contentDocument?.getElementById('product-loaded')?.hidden===false)break;await wait();}const d=f.contentDocument,w=f.contentWindow;check(d.getElementById('product-title').textContent.includes('Tomato'),'matching product');check(d.querySelectorAll('.related-card').length===4,'related products');d.getElementById('quantity-plus').click();check(d.getElementById('product-quantity').value==='2','quantity');d.getElementById('product-add').click();check(JSON.parse(w.localStorage.getItem('urbor-catalog-basket'))['6302']===2,'shared basket');d.documentElement.lang='bn';await wait();check(d.getElementById('product-title').textContent.includes('টমেটো'),'Bengali');check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'mobile width');w.localStorage.removeItem('urbor-catalog-basket');document.getElementById('result').textContent='PASS: product data, related links, quantity, shared basket, Bengali, mobile width';}catch(e){document.getElementById('result').textContent='FAIL: '+e.message;}})();</script>
