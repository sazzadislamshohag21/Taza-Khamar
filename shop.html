<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Fresh Produce — Taza Khamar</title>
  <meta name="description" content="Browse fish, meat, poultry, vegetables, fruits, dairy and honey sourced directly from verified Bangladeshi farmers." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232C8850'/%3E%3Cstop offset='100%25' stop-color='%23154A2A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='18.3' cy='4.7' r='2.1' fill='%23F0932B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body data-page="shop">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html" data-i18n="breadcrumb.home"></a>
        <span class="sep" id="crumbSep"></span>
        <span class="current" data-i18n="nav.shop"></span>
      </nav>
    </div>

    <section class="section-tight">
      <div class="container">
        <div class="section-header" style="align-items:flex-start">
          <div>
            <h1 style="font-size:var(--fs-2xl)" data-i18n="shop.title"></h1>
            <p data-i18n="shop.lead"></p>
          </div>
          <button class="btn btn-outline mobile-filter-toggle" id="mobileFilterToggle" data-i18n="shop.filters"></button>
        </div>

        <div class="shop-layout">
          <aside class="filters" id="filtersPanel">
            <div class="filter-group">
              <h4 data-i18n="shop.category"></h4>
              <div id="categoryFilters"></div>
            </div>
            <div class="filter-group">
              <h4 data-i18n="shop.price"></h4>
              <div class="price-range">
                <input type="number" id="priceMin" placeholder="Min" min="0" />
                <span>–</span>
                <input type="number" id="priceMax" placeholder="Max" min="0" />
              </div>
            </div>
            <div class="filter-group">
              <h4 data-i18n="shop.district"></h4>
              <div id="districtFilters"></div>
            </div>
            <div class="filter-group">
              <h4 data-i18n="shop.rating"></h4>
              <div id="ratingFilters"></div>
            </div>
            <button class="btn btn-ghost" id="clearFilters" data-i18n="shop.clear"></button>
          </aside>

          <div>
            <div class="shop-toolbar">
              <span class="results-count" id="resultsCount"></span>
              <select id="sortSelect">
                <option value="popular" data-i18n="shop.sort.popular"></option>
                <option value="priceLow" data-i18n="shop.sort.priceLow"></option>
                <option value="priceHigh" data-i18n="shop.sort.priceHigh"></option>
                <option value="rating" data-i18n="shop.sort.rating"></option>
              </select>
            </div>
            <div class="grid grid-4" id="shopGrid"></div>
            <div class="empty-state" id="emptyState" style="display:none">
              <span id="emptyIcon"></span>
              <p data-i18n="shop.noresults"></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
