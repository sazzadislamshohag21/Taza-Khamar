<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Taza Khamar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232C8850'/%3E%3Cstop offset='100%25' stop-color='%23154A2A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='18.3' cy='4.7' r='2.1' fill='%23F0932B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body data-page="">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="section">
      <div class="container">
        <div class="card auth-box">
          <div class="auth-tabs">
            <button class="active" data-tab="login" data-i18n="auth.login"></button>
            <button data-tab="signup" data-i18n="auth.signup"></button>
          </div>

          <form id="loginForm" data-panel="login">
            <div class="form-field">
              <label data-i18n="auth.email"></label>
              <input type="text" required />
            </div>
            <div class="form-field">
              <label data-i18n="auth.password"></label>
              <input type="password" required />
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);margin-bottom:var(--sp-md)">
              <label style="display:flex;align-items:center;gap:.4rem;width:auto"><input type="checkbox" style="width:auto" /> <span data-i18n="auth.remember"></span></label>
              <a href="#" style="color:var(--color-primary)" data-i18n="auth.forgot"></a>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="auth.login"></button>
          </form>

          <form id="signupForm" data-panel="signup" style="display:none">
            <div class="form-field">
              <label data-i18n="auth.fullname"></label>
              <input type="text" required />
            </div>
            <div class="form-field">
              <label data-i18n="auth.email"></label>
              <input type="text" required />
            </div>
            <div class="form-field">
              <label data-i18n="auth.password"></label>
              <input type="password" required />
            </div>
            <div class="form-field">
              <label data-i18n="auth.confirmpassword"></label>
              <input type="password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="auth.createaccount"></button>
          </form>

          <div class="auth-divider" data-i18n="auth.or"></div>
          <button class="btn btn-outline btn-block" id="whatsappLoginBtn">
            <span data-i18n="topbar.whatsapp"></span>
          </button>

          <p style="text-align:center;margin-top:var(--sp-md);font-size:var(--fs-sm)">
            <span class="js-auth-switch-text" data-i18n="auth.noaccount"></span>
            <a href="#" id="authSwitchLink" style="color:var(--color-primary);font-weight:600" data-i18n="auth.signup"></a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
