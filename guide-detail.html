<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body data-page="guides">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <nav class="breadcrumb" id="crumb"></nav>
    </div>
    <section class="section-tight">
      <div class="container">
        <article class="guide-article" id="guideArticle"></article>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/render.js"></script>
  <script>
    function renderGuideDetail() {
      const id = new URLSearchParams(window.location.search).get("id");
      const g = GUIDES.find((x) => x.id === id) || GUIDES[0];
      const color = catColorClass(PRODUCTS.find((p) => p.icon === g.icon)?.category || "fish");

      document.getElementById("crumb").innerHTML = `
        <a href="index.html">${t("breadcrumb.home")}</a><span class="sep">${icon("chevronRight")}</span>
        <a href="guides.html">${t("guides.title")}</a><span class="sep">${icon("chevronRight")}</span>
        <span class="current">${getLang() === "bn" ? g.titleBn : g.title}</span>`;

      document.getElementById("guideArticle").innerHTML = `
        <div class="guide-article__hero" style="${mediaBg(color)}">${icon(g.icon)}</div>
        <span class="badge">${g.category} · ${g.minutes} ${t("guides.readtime")}</span>
        <h1 style="margin-top:.6rem">${getLang() === "bn" ? g.titleBn : g.title}</h1>
        <p style="font-size:var(--fs-md);margin-top:.6rem">${g.excerpt}</p>
        <div style="margin-top:var(--sp-md)">
          ${g.body.map((para) => `<p>${para}</p>`).join("")}
        </div>
        <a href="guides.html" class="btn btn-outline" style="margin-top:var(--sp-lg)">${t("guides.back")}</a>`;
      document.title = `${g.title} — Taza Khamar`;
    }
    document.addEventListener("DOMContentLoaded", renderGuideDetail);
    document.addEventListener("tk:langchange", renderGuideDetail);
  </script>
</body>
</html>
