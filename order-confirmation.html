<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Taza Khamar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232C8850'/%3E%3Cstop offset='100%25' stop-color='%23154A2A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='18.3' cy='4.7' r='2.1' fill='%23F0932B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body data-page="">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <div class="confirm-box" id="confirmBox"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function renderConfirmation() {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("order") || "TK000000";
      const etaLabels = {
        1: t("checkout.morning") + " (8am–11am)",
        2: t("checkout.afternoon") + " (12pm–4pm)",
        3: t("checkout.evening") + " (5pm–8pm)",
      };
      let order = null;
      try { order = JSON.parse(localStorage.getItem("tk_last_order")); } catch {}
      const eta = order ? `${[t("checkout.today"), t("checkout.tomorrow"), t("checkout.dayafter")][order.date]} · ${etaLabels[order.slot]}` : "—";

      document.getElementById("confirmBox").innerHTML = `
        <div class="confirm-icon">${icon("checkCircle")}</div>
        <h1 data-i18n="confirm.title">${t("confirm.title")}</h1>
        <p data-i18n="confirm.lead">${t("confirm.lead")}</p>
        <div class="card order-summary-mini">
          <div class="summary-row"><span data-i18n="confirm.orderid">${t("confirm.orderid")}</span><strong>${orderId}</strong></div>
          <div class="summary-row"><span data-i18n="confirm.eta">${t("confirm.eta")}</span><strong>${eta}</strong></div>
          ${order ? `<div class="summary-row total"><span>${t("cart.total")}</span><span>${formatBDT(order.total)}</span></div>` : ""}
        </div>
        <div style="display:flex;gap:.7rem;justify-content:center;margin-top:var(--sp-lg);flex-wrap:wrap">
          <a href="account.html" class="btn btn-outline" data-i18n="confirm.trackbtn">${t("confirm.trackbtn")}</a>
          <a href="shop.html" class="btn btn-primary" data-i18n="confirm.continue">${t("confirm.continue")}</a>
        </div>`;
    }
    document.addEventListener("DOMContentLoaded", renderConfirmation);
    document.addEventListener("tk:langchange", renderConfirmation);
  </script>
</body>
</html>
