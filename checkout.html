<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Taza Khamar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232C8850'/%3E%3Cstop offset='100%25' stop-color='%23154A2A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='18.3' cy='4.7' r='2.1' fill='%23F0932B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body data-page="checkout">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <nav class="breadcrumb" id="crumb"></nav>
      <h1 style="font-size:var(--fs-2xl);margin-bottom:var(--sp-md)" data-i18n="checkout.title"></h1>

      <div class="checkout-steps" id="checkoutSteps"></div>

      <div class="checkout-layout">
        <div>
          <!-- Step 1: Address -->
          <div class="card checkout-panel" data-step="1">
            <h3 data-i18n="checkout.address"></h3>
            <div class="form-row">
              <div class="form-field">
                <label data-i18n="checkout.fullname"></label>
                <input type="text" id="fFullname" required />
              </div>
              <div class="form-field">
                <label data-i18n="checkout.phone"></label>
                <input type="tel" id="fPhone" placeholder="01XXXXXXXXX" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label data-i18n="checkout.city"></label>
                <select id="fCity"></select>
              </div>
              <div class="form-field">
                <label data-i18n="checkout.area"></label>
                <input type="text" id="fArea" required />
              </div>
            </div>
            <div class="form-field">
              <label data-i18n="checkout.fulladdress"></label>
              <textarea id="fAddress" rows="2" required></textarea>
            </div>
            <div class="form-field">
              <label data-i18n="checkout.notes"></label>
              <textarea id="fNotes" rows="2"></textarea>
            </div>
            <button class="btn btn-primary" id="toStep2" data-i18n="checkout.continueSlot"></button>
          </div>

          <!-- Step 2: Delivery Slot -->
          <div class="card checkout-panel" data-step="2" style="display:none">
            <h3 data-i18n="checkout.slot"></h3>
            <div class="form-field">
              <label data-i18n="checkout.date"></label>
              <select id="fDate"></select>
            </div>
            <div class="slot-grid" id="slotGrid"></div>
            <div style="display:flex;gap:.6rem;margin-top:var(--sp-md)">
              <button class="btn btn-outline" id="toStep1Back" data-i18n="checkout.back"></button>
              <button class="btn btn-primary" id="toStep3" data-i18n="checkout.continuePayment"></button>
            </div>
          </div>

          <!-- Step 3: Payment -->
          <div class="card checkout-panel" data-step="3" style="display:none">
            <h3 data-i18n="checkout.payment"></h3>
            <div id="paymentOptions"></div>
            <div style="display:flex;gap:.6rem;margin-top:var(--sp-md)">
              <button class="btn btn-outline" id="toStep2Back" data-i18n="checkout.back"></button>
              <button class="btn btn-primary btn-lg" id="placeOrderBtn" data-i18n="checkout.placeorder"></button>
            </div>
          </div>
        </div>

        <div class="card summary-card" id="checkoutSummary"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
