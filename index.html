<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taza Khamar — Farm Fresh Food, Direct to Your Door</title>
  <meta name="description" content="Taza Khamar connects Bangladeshi families directly with trusted local farmers and fishers — fresh fish, meat, vegetables, fruits and honey, delivered to your door." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232C8850'/%3E%3Cstop offset='100%25' stop-color='%23154A2A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='18.3' cy='4.7' r='2.1' fill='%23F0932B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body data-page="home">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <!-- HERO -->
    <section class="hero">
      <div class="hero__blob hero__blob--1"></div>
      <div class="hero__blob hero__blob--2"></div>
      <div class="container">
        <div>
          <span class="eyebrow" data-i18n="hero.eyebrow"></span>
          <h1 class="hero__title"><span data-i18n="hero.title1"></span><br/><span class="accent-text" data-i18n="hero.title2"></span></h1>
          <p class="hero__lead" data-i18n="hero.lead"></p>

          <div class="location-picker">
            <span id="heroLocIcon"></span>
            <select id="heroLocation" aria-label="Delivery location"></select>
            <button class="btn btn-primary" id="heroShopBtn" data-i18n="hero.shopNow"></button>
          </div>

          <div class="hero__actions" style="margin-top:var(--sp-md)">
            <a href="#how-it-works" class="btn btn-outline" data-i18n="hero.howItWorks"></a>
          </div>

          <div class="hero__stats">
            <div><strong data-i18n="hero.stat1n"></strong><span data-i18n="hero.stat1t"></span></div>
            <div><strong data-i18n="hero.stat2n"></strong><span data-i18n="hero.stat2t"></span></div>
            <div><strong data-i18n="hero.stat3n"></strong><span data-i18n="hero.stat3t"></span></div>
          </div>
        </div>
        <div class="hero__art" id="heroArt">
          <div class="hero__badge-float a"><span style="color:var(--color-primary)">●</span> <span data-i18n="trust.fresh"></span></div>
          <div class="hero__badge-float b"><span style="color:var(--color-accent)">●</span> <span data-i18n="trust.cod"></span></div>
        </div>
      </div>
    </section>

    <!-- TRUST BAR -->
    <section class="trust-bar">
      <div class="container" id="trustBar"></div>
    </section>

    <!-- CATEGORIES -->
    <section class="section">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="eyebrow" data-i18n="cat.eyebrow"></span>
            <h2 data-i18n="cat.title"></h2>
            <p data-i18n="cat.lead"></p>
          </div>
        </div>
        <div class="grid grid-6" id="categoryGrid"></div>
      </div>
    </section>

    <!-- FEATURED PRODUCTS -->
    <section class="section" style="background:var(--color-surface-alt)">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="eyebrow" data-i18n="featured.eyebrow"></span>
            <h2 data-i18n="featured.title"></h2>
            <p data-i18n="featured.lead"></p>
          </div>
          <a href="shop.html" class="btn btn-outline" data-i18n="featured.viewAll"></a>
        </div>
        <div class="grid grid-4" id="featuredGrid"></div>
      </div>
    </section>

    <!-- FARMERS -->
    <section class="section">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="eyebrow" data-i18n="farmers.eyebrow"></span>
            <h2 data-i18n="farmers.title"></h2>
            <p data-i18n="farmers.lead"></p>
          </div>
          <a href="farmers.html" class="btn btn-outline" data-i18n="farmers.viewAll"></a>
        </div>
        <div class="grid grid-4" id="farmersGrid"></div>
      </div>
    </section>

    <!-- HOW IT WORKS -->
    <section class="section" id="how-it-works" style="background:var(--color-primary-light)">
      <div class="container">
        <div class="section-header" style="justify-content:center;text-align:center;flex-direction:column;align-items:center">
          <span class="eyebrow" data-i18n="how.eyebrow"></span>
          <h2 data-i18n="how.title"></h2>
        </div>
        <div class="steps-row">
          <div class="step"><span class="step__num">1</span><h4 data-i18n="how.s1t"></h4><p data-i18n="how.s1d"></p></div>
          <div class="step"><span class="step__num">2</span><h4 data-i18n="how.s2t"></h4><p data-i18n="how.s2d"></p></div>
          <div class="step"><span class="step__num">3</span><h4 data-i18n="how.s3t"></h4><p data-i18n="how.s3d"></p></div>
          <div class="step"><span class="step__num">4</span><h4 data-i18n="how.s4t"></h4><p data-i18n="how.s4d"></p></div>
        </div>
      </div>
    </section>

    <!-- WHY US -->
    <section class="section">
      <div class="container">
        <div class="section-header" style="flex-direction:column;align-items:flex-start">
          <span class="eyebrow" data-i18n="why.eyebrow"></span>
          <h2 data-i18n="why.title"></h2>
        </div>
        <div class="grid grid-3" id="whyGrid"></div>
      </div>
    </section>

    <!-- TESTIMONIALS -->
    <section class="section" style="background:var(--color-surface-alt)">
      <div class="container">
        <div class="section-header" style="flex-direction:column;align-items:flex-start">
          <span class="eyebrow" data-i18n="testi.eyebrow"></span>
          <h2 data-i18n="testi.title"></h2>
        </div>
        <div class="grid grid-4" id="testimonialGrid"></div>
      </div>
    </section>

    <!-- APP PROMO -->
    <section class="section">
      <div class="container">
        <div class="app-promo">
          <div>
            <span class="badge badge-accent" data-i18n="app.eyebrow"></span>
            <h2 style="color:#fff;margin-top:.5rem" data-i18n="app.title"></h2>
            <p data-i18n="app.lead"></p>
            <div class="app-promo__stores" id="storeBadges"></div>
          </div>
          <div class="app-promo__art" id="appArt"></div>
        </div>
      </div>
    </section>

    <!-- CTA BAND -->
    <section class="section section-tight">
      <div class="container">
        <div class="cta-band">
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.lead"></p>
          <form id="ctaForm">
            <input type="text" data-i18n-placeholder="cta.placeholder" required />
            <button type="submit" class="btn btn-accent" data-i18n="cta.button"></button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
