<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Taza Khamar</title>
  <meta name="description" content="Questions about an order, a farmer, or delivery? Get in touch with Taza Khamar." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body data-page="contact">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="contact.title"></h1>
        <p data-i18n="contact.lead"></p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-layout">
        <div>
          <div class="card" style="padding:var(--sp-lg)">
            <form id="contactForm">
              <div class="form-row">
                <div class="form-field">
                  <label data-i18n="contact.name"></label>
                  <input type="text" required />
                </div>
                <div class="form-field">
                  <label data-i18n="contact.email"></label>
                  <input type="email" required />
                </div>
              </div>
              <div class="form-field">
                <label data-i18n="contact.subject"></label>
                <input type="text" required />
              </div>
              <div class="form-field">
                <label data-i18n="contact.message"></label>
                <textarea rows="5" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-lg" data-i18n="contact.send"></button>
            </form>
          </div>

          <div style="margin-top:var(--sp-xl)">
            <h3 data-i18n="contact.faq" style="margin-bottom:var(--sp-sm)"></h3>
            <div id="faqAccordion"></div>
          </div>
        </div>

        <div id="contactInfoCards"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/contact.js"></script>
</body>
</html>
